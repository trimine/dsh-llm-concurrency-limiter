<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 48 48" width="48" height="48" fill="none">
  <rect width="48" height="48" rx="10" fill="#1E293B"/>
  <!-- Concurrency meter arc -->
  <path d="M12 32 A 16 16 0 1 1 36 32" stroke="#64748B" stroke-width="3" stroke-linecap="round"/>
  <path d="M12 32 A 16 16 0 0 1 28 12.5" stroke="#38BDF8" stroke-width="3.5" stroke-linecap="round"/>
  <!-- Center gauge hub -->
  <circle cx="24" cy="27" r="4" fill="#0EA5E9"/>
  <!-- Needle pointing to controlled limit zone -->
  <line x1="24" y1="27" x2="30" y2="17" stroke="#F8FAFC" stroke-width="2.5" stroke-linecap="round"/>
  <!-- Limit indicator mark -->
  <line x1="33" y1="17" x2="36" y2="14" stroke="#F43F5E" stroke-width="2" stroke-linecap="round"/>
  <!-- Parallel task queues below -->
  <rect x="14" y="36" width="6" height="3" rx="1.5" fill="#38BDF8"/>
  <rect x="22" y="36" width="6" height="3" rx="1.5" fill="#38BDF8"/>
  <rect x="30" y="36" width="6" height="3" rx="1.5" fill="#64748B" opacity="0.6"/>
</svg>
